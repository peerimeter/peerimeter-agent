name: Retry macOS runner acquisition failures

on:
  workflow_run:
    workflows: [Peerimeter CI and Release]
    types: [completed]

permissions:
  actions: write
  checks: read

jobs:
  retry-macos-runner:
    name: Retry unacquired macOS arm64 job
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Rerun only the unacquired macOS arm64 job
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          current_attempt=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" --jq '.run_attempt')
          if [ "$current_attempt" != "$RUN_ATTEMPT" ]; then
            echo "A newer workflow attempt already exists; nothing to retry."
            exit 0
          fi

          jobs=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100")
          job=$(jq -c '
            [
              .jobs[]
              | select(
                  .name == "darwin / Test, integration & package"
                  and (.conclusion == "cancelled" or .conclusion == "failure")
                  and .runner_id == 0
                  and (.runner_name == null or .runner_name == "")
                  and (.steps | length) == 0
                  and (.labels | index("macos-15") != null)
                )
            ]
            | if length == 1 then .[0] else empty end
          ' <<< "$jobs")

          if [ -z "$job" ]; then
            echo "No unacquired macOS arm64 job found; nothing to retry."
            exit 0
          fi

          check_run_url=$(jq -r '.check_run_url' <<< "$job")
          annotations=$(gh api --paginate "$check_run_url/annotations")
          if ! jq -e '
            any(
              .[];
              .annotation_level == "failure"
              and (.message | contains("The job was not acquired by Runner of type hosted even after multiple attempts"))
            )
          ' <<< "$annotations" >/dev/null; then
            echo "The macOS job has no runner-acquisition failure annotation; nothing to retry."
            exit 0
          fi

          job_id=$(jq -r '.id' <<< "$job")
          current_attempt=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" --jq '.run_attempt')
          if [ "$current_attempt" != "$RUN_ATTEMPT" ]; then
            echo "A newer workflow attempt started before retry; nothing to retry."
            exit 0
          fi

          echo "Rerunning macOS arm64 job $job_id from workflow run $RUN_ID."
          gh api --method POST "repos/$REPOSITORY/actions/jobs/$job_id/rerun"
