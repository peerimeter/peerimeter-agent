name: Native agent WireGuard integration
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent:
    name: Agent / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      AGENT_EXE: peerimeter-agent${{ matrix.os == 'windows-2022' && '.exe' || '' }}
      PROBE_EXE: pmprobe${{ matrix.os == 'windows-2022' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build actual agent and reference peer
        shell: bash
        run: |
          test "$(go env GOVERSION | tr -d '\r')" = go1.27.4
          go build -mod=readonly -o "$RUNNER_TEMP/$AGENT_EXE" ./cmd/peerimeter-agent
          if [ "$RUNNER_OS" != Linux ]; then
            go build -C tests/backendprobe -mod=readonly -o "$RUNNER_TEMP/$PROBE_EXE" .
          fi
          if [ "$RUNNER_OS" != Windows ]; then
            legacy_source=$(mktemp -d "$RUNNER_TEMP/legacy-source.XXXXXX")
            git fetch --depth=1 origin 4246c6bea040bfa41a0bd506f0df501310a20367
            git archive FETCH_HEAD | tar -x -C "$legacy_source"
            go build -C "$legacy_source" -mod=readonly -o "$RUNNER_TEMP/legacy-agent" ./cmd/peerimeter-agent
          fi
      - name: Prepare bundled signed Windows driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/prepare-wireguardnt.ps1 -Destination $env:RUNNER_TEMP
      - name: Two Linux agents and systemd lifecycle
        if: runner.os == 'Linux'
        id: linux
        shell: bash
        run: sudo bash scripts/ci/linux-agent.sh "$RUNNER_TEMP/$AGENT_EXE" "$RUNNER_TEMP/legacy-agent"
      - name: macOS agent traffic and launchd lifecycle
        if: runner.os == 'macOS'
        id: macos
        shell: bash
        run: sudo bash scripts/ci/macos-agent.sh "$RUNNER_TEMP/$AGENT_EXE" "$RUNNER_TEMP/$PROBE_EXE" "$RUNNER_TEMP/legacy-agent"
      - name: Windows agent traffic and SCM lifecycle
        if: runner.os == 'Windows'
        id: windows
        shell: pwsh
        run: ./scripts/ci/windows-agent.ps1 -Agent "$env:RUNNER_TEMP/$env:AGENT_EXE" -Helper "$env:RUNNER_TEMP/$env:PROBE_EXE"
      - name: Record native agent evidence
        if: always()
        shell: bash
        env:
          PROBE_KIND: native-agent-integration-v1
          PROBE_OUTCOME: ${{ steps.linux.outcome == 'success' || steps.macos.outcome == 'success' || steps.windows.outcome == 'success' }}
        run: |
          if [ "$PROBE_OUTCOME" = true ]; then export PROBE_OUTCOME=success; fi
          python scripts/ci/report.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-result-${{ matrix.os }}
          path: ${{ runner.temp }}/peerimeter-result.json
          if-no-files-found: error
          retention-days: 14
