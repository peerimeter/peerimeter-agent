name: WireGuard backend feasibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-feasibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      PROBE_EXE: pmprobe${{ matrix.os == 'windows-2022' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build reference peer (separate test module)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          test "$(go env GOVERSION)" = go1.27.4
          go build -C tests/backendprobe -mod=readonly -o "$RUNNER_TEMP/$PROBE_EXE" .
      - name: Build pinned official Unix backend tools
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/install-unix-backend.sh "$RUNNER_TEMP/backend-tools"
      - name: Install verified official Windows test prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/install-windows-backend.ps1
      - name: Probe Linux kernel backend
        if: runner.os == 'Linux'
        id: linux
        shell: bash
        run: sudo env PATH="$RUNNER_TEMP/backend-tools:$PATH" bash scripts/ci/linux-backend.sh
      - name: Probe macOS native utun backend
        if: runner.os == 'macOS'
        id: macos
        shell: bash
        run: sudo env PATH="$RUNNER_TEMP/backend-tools:$PATH" bash scripts/ci/macos-backend.sh "$RUNNER_TEMP/pmprobe"
      - name: Probe Windows native WireGuardNT backend
        if: runner.os == 'Windows'
        id: windows
        shell: pwsh
        run: ./scripts/ci/windows-backend.ps1 -Helper "$env:RUNNER_TEMP/pmprobe.exe"
      - name: Record backend evidence
        if: always()
        shell: bash
        env:
          PROBE_KIND: native-backend-feasibility-not-agent-integration
          PROBE_OUTCOME: ${{ steps.linux.outcome == 'success' || steps.macos.outcome == 'success' || steps.windows.outcome == 'success' }}
        run: |
          if [ "$PROBE_OUTCOME" = true ]; then export PROBE_OUTCOME=success; fi
          python scripts/ci/report.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-result-${{ matrix.os }}
          path: ${{ runner.temp }}/peerimeter-result.json
          if-no-files-found: error
          retention-days: 14
