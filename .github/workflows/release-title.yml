name: Set release title from version
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  title:
    runs-on: ubuntu-24.04
    steps:
      - name: Set release title to its version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --title "$RELEASE_TAG"
