name: Publish release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.semver.outputs.next }}
      bump: ${{ steps.semver.outputs.bump }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: semver
        name: Calculate next version from Conventional Commits
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1.11.0
        with:
          token: ${{ github.token }}
          branch: main
          noNewCommitBehavior: current
          noVersionBumpBehavior: current

  build:
    needs: version
    if: needs.version.outputs.bump != 'none'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
            native_test: true
          - runner: ubuntu-24.04
            os: linux
            arch: arm64
            native_test: false
          - runner: macos-15
            os: darwin
            arch: arm64
            native_test: true
          - runner: macos-15
            os: darwin
            arch: amd64
            native_test: false
          - runner: windows-2022
            os: windows
            arch: amd64
            native_test: true
          - runner: windows-2022
            os: windows
            arch: arm64
            native_test: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.tag }}
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build release asset with licenses and bundled Windows driver
        shell: bash
        run: python scripts/package.py --os '${{ matrix.os }}' --arch '${{ matrix.arch }}' --version "$RELEASE_VERSION"
      - name: Unix installer latest/pin/offline/custom-path checks
        if: matrix.native_test && runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/ci/unix-installer.sh
          asset="peerimeter-agent-${{ matrix.os }}-${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}"
          digest=$(awk -v name="$asset" '$2 == name {print $1}' dist/SHA256SUMS)
          notices="$asset.NOTICES.txt"
          notices_digest=$(awk -v name="$notices" '$2 == name {print $1}' dist/SHA256SUMS)
          sh install.sh --binary "dist/$asset" --sha256 "$digest" --notices "dist/$notices" --notices-sha256 "$notices_digest" --install-dir "$RUNNER_TEMP/real package install/bin"
          "$RUNNER_TEMP/real package install/bin/peerimeter-agent" version --json > "$RUNNER_TEMP/installed-version.json"
          python -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/installed-version.json")); assert p["version"]==os.environ["RELEASE_VERSION"] and p["go_version"]=="go1.27.4"'
      - name: Windows installer latest/pin/offline/custom-path checks
        if: matrix.native_test && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/windows-installer.ps1 -PackageDirectory ./dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/peerimeter-agent-*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [version, build]
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-package-*
          path: dist
          merge-multiple: true
      - name: Create checksums and publish tag/release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          cd dist
          sha256sum peerimeter-agent-* > SHA256SUMS
          cd ..
          gh release create "$RELEASE_TAG" dist/peerimeter-agent-* dist/SHA256SUMS \
            --repo "$REPOSITORY" --target "$TARGET_SHA" --title "$RELEASE_TAG" --generate-notes
