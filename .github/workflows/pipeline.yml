name: Peerimeter CI and Release
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in packages (no release is published)
        default: v0.1.0-dev
        required: true
permissions:
  contents: read
concurrency:
  group: peerimeter-pipeline-${{ github.ref }}
  # Do not interrupt a release once main starts publishing it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  native:
    name: Test, integration & package / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
          - runner: macos-15-intel
            os: darwin
          - runner: windows-2022
            os: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      RELEASE_VERSION: ${{ inputs.version || 'v0.1.0-dev' }}
      AGENT_EXE: bin/peerimeter-agent${{ matrix.os == 'windows' && '.exe' || '' }}
      PROBE_EXE: pmprobe${{ matrix.os == 'windows' && '.exe' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Format, vet, tests and build
        id: tests
        run: |
          test "$(go env GOVERSION | tr -d '\r')" = go1.27.4
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...
          go test -race ./...
          go build -o "$AGENT_EXE" ./cmd/peerimeter-agent
      - name: Self-update installed-binary E2E
        env:
          PEERIMETER_SELF_UPDATE_E2E: '1'
        run: go test ./internal/cli -run '^TestSelfUpdateBinaryEndToEnd$' -count=1
      - name: Offline CLI smoke tests
        id: smoke
        run: |
          ./$AGENT_EXE version
          ./$AGENT_EXE version --json
          ./$AGENT_EXE --help
          ./$AGENT_EXE run --help
          ./$AGENT_EXE service install --help
          ./$AGENT_EXE completion bash > "$RUNNER_TEMP/peerimeter-completion.bash"
          ./$AGENT_EXE generate-example --directory "$RUNNER_TEMP/peerimeter-example"
          ./$AGENT_EXE validate-config --config "$RUNNER_TEMP/peerimeter-example/peer-a.yaml"
          ./$AGENT_EXE validate-config --config "$RUNNER_TEMP/peerimeter-example/peer-b.yaml"
      - name: Build static agent and reference peer for integration
        env:
          CGO_ENABLED: '0'
        run: |
          go build -mod=readonly -o "$RUNNER_TEMP/$AGENT_EXE" ./cmd/peerimeter-agent
          if [ "$RUNNER_OS" != Linux ]; then
            go build -C tests/backendprobe -mod=readonly -o "$RUNNER_TEMP/$PROBE_EXE" .
          fi
      - name: Install YAML parser for Linux integration assertions
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Prepare bundled signed Windows driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/prepare-wireguardnt.ps1 -Destination $env:RUNNER_TEMP
      - name: Two Linux agents and systemd lifecycle
        if: runner.os == 'Linux'
        id: linux
        run: sudo bash scripts/ci/linux-agent.sh "$RUNNER_TEMP/$AGENT_EXE"
      - name: macOS agent traffic and launchd lifecycle
        if: runner.os == 'macOS'
        id: macos
        run: sudo bash scripts/ci/macos-agent.sh "$RUNNER_TEMP/$AGENT_EXE" "$RUNNER_TEMP/$PROBE_EXE"
      - name: Windows agent traffic and SCM lifecycle
        if: runner.os == 'Windows'
        id: windows
        shell: pwsh
        run: ./scripts/ci/windows-agent.ps1 -Agent "$env:RUNNER_TEMP/$env:AGENT_EXE" -Helper "$env:RUNNER_TEMP/$env:PROBE_EXE"
      - name: Record native agent evidence
        if: always()
        env:
          PROBE_KIND: native-agent-integration-v1
          PROBE_OUTCOME: ${{ steps.linux.outcome == 'success' || steps.macos.outcome == 'success' || steps.windows.outcome == 'success' }}
        run: |
          if [ "$PROBE_OUTCOME" = true ]; then export PROBE_OUTCOME=success; fi
          python scripts/ci/report.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: agent-result-${{ matrix.runner }}
          path: ${{ runner.temp }}/peerimeter-result.json
          if-no-files-found: error
          retention-days: 14
      - name: Build package with licenses and bundled Windows driver
        env:
          CGO_ENABLED: '0'
        run: python scripts/package.py --os '${{ matrix.os }}' --arch amd64 --version "$RELEASE_VERSION"
      - name: Unix installer latest/pin/offline/custom-path tests
        if: runner.os != 'Windows'
        run: |
          bash scripts/ci/unix-installer.sh
          asset="peerimeter-agent-${{ matrix.os }}-x86_64"
          digest=$(awk -v name="$asset" '$2 == name {print $1}' dist/SHA256SUMS)
          notices="$asset.NOTICES.txt"
          notices_digest=$(awk -v name="$notices" '$2 == name {print $1}' dist/SHA256SUMS)
          sh docs/install.sh --binary "dist/$asset" --sha256 "$digest" --notices "dist/$notices" --notices-sha256 "$notices_digest" --install-dir "$RUNNER_TEMP/real package install/bin"
          "$RUNNER_TEMP/real package install/bin/peerimeter-agent" version --json > "$RUNNER_TEMP/installed-version.json"
          python -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/installed-version.json")); assert p["version"]==os.environ["RELEASE_VERSION"] and p["go_version"]=="go1.27.4"'
      - name: Windows installer latest/pin/offline/custom-path tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/windows-installer.ps1 -PackageDirectory ./dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: package-${{ matrix.os }}-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  package-cross:
    name: Package / arm64 cross-compile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version || 'v0.1.0-dev' }}
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build arm64 packages
        run: |
          for os in linux darwin windows; do
            python scripts/package.py --os "$os" --arch arm64 --version "$RELEASE_VERSION"
          done
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: package-cross-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  check:
    name: check
    if: always()
    needs: [native, package-cross]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install GitHub Actions lock verifier
        run: gh extension install github/gh-actions-lock
      - name: Verify locked action dependencies
        run: gh actions-lock --verify
      - name: Require every PR gate to pass
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          PACKAGE_CROSS_RESULT: ${{ needs.package-cross.result }}
        run: |
          test "$NATIVE_RESULT" = success
          test "$PACKAGE_CROSS_RESULT" = success

  release:
    name: release
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: semver
        name: Calculate next version from Conventional Commits
        uses: ietf-tools/semver-action@v1.12.0
        with:
          token: ${{ github.token }}
          branch: main
          fallbackTag: v0.0.0
          noNewCommitBehavior: current
          noVersionBumpBehavior: current
      - uses: actions/setup-go@v7.0.0
        if: steps.semver.outputs.bump != 'none'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Create local release tag for GoReleaser
        if: steps.semver.outputs.bump != 'none'
        run: git tag "${{ steps.semver.outputs.next }}" "$GITHUB_SHA"
      - name: Build and publish with GoReleaser
        if: steps.semver.outputs.bump != 'none'
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.20.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
