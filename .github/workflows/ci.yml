name: Cross-platform Agent Build and Test
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      AGENT_EXE: bin/peerimeter-agent${{ matrix.os == 'windows-2022' && '.exe' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Format, vet, tests and build
        id: tests
        run: |
          test "$(go env GOVERSION | tr -d '\r')" = go1.27.4
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...
          go test -race ./...
          go build -o "$AGENT_EXE" ./cmd/peerimeter-agent
      - name: Offline CLI smoke tests
        id: smoke
        run: |
          ./"$AGENT_EXE" version
          ./"$AGENT_EXE" version --json
          ./"$AGENT_EXE" --help
          ./"$AGENT_EXE" run --help
          ./"$AGENT_EXE" service install --help
          ./"$AGENT_EXE" completion bash > "$RUNNER_TEMP/peerimeter-completion.bash"
          ./"$AGENT_EXE" generate-example --directory "$RUNNER_TEMP/peerimeter-example"
          ./"$AGENT_EXE" validate-config --config "$RUNNER_TEMP/peerimeter-example/peer-a.json"
          ./"$AGENT_EXE" validate-config --config "$RUNNER_TEMP/peerimeter-example/peer-b.json"
      - name: Record native evidence
        if: always()
        env:
          PROBE_KIND: native-unit-build-cli
          PROBE_OUTCOME: ${{ steps.tests.outcome == 'success' && steps.smoke.outcome == 'success' && 'success' || 'failure' }}
        run: python scripts/ci/report.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-result-${{ matrix.os }}
          path: ${{ runner.temp }}/peerimeter-result.json
          if-no-files-found: error
          retention-days: 14
