name: Connectivity E2E
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  availability:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Report pending mixed-OS and disruption topology
        shell: bash
        run: |
          echo 'Status: blocked. Native Phase 1 agent links and services are verified in wireguard-integration.yml. Mixed-OS VM connectivity needs a reachable dedicated test topology; managed NAT/public-endpoint recovery belongs to Phase 3 and is not implemented yet.' >> "$GITHUB_STEP_SUMMARY"
          echo '::error::blocked: mixed-OS and NAT/disruption E2E infrastructure is not provisioned. Native single-platform agent integration results do not prove these scenarios.'
          exit 1
